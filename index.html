<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My PhD University Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>My PhD University Atlas</h1>
      <p>Migration &amp; Social Sciences — professors, papers &amp; conferences, mapped</p>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <div id="app">
    <div id="map"></div>
    <aside id="sidebar" class="hidden">
      <button id="close-sidebar" aria-label="Close">✕</button>
      <div id="sidebar-content"></div>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
